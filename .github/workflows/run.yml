steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install packages
    run: |
      python -m pip install --upgrade pip
      pip install requests pandas numpy flask gunicorn

  - name: Check Python syntax
    run: |
      python -m py_compile main.py

  - name: Check dashboard files
    run: |
      test -f main.py
      test -f templates/index.html
      echo "Python and dashboard files found."

  - name: Save trade memory
    if: always()
    run: |
      git config user.name "market-brain-bot"
      git config user.email "market-brain-bot@users.noreply.github.com"

      git add market_brain_data

      if git diff --cached --quiet; then
        echo "No memory changes to save."
      else
        git commit -m "Save Market Brain trade memory"
        git push origin HEAD:main
      fi
      
