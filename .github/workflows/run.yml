name: MARKET BRAIN AI

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: market-brain-ai
  cancel-in-progress: false

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market scanner
        env:
          RUN_ONCE: "1"
          BINANCE_BASE: https://data-api.binance.vision
          DATA_DIR: market_brain_data
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main.py

      - name: Save scanner data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add market_brain_data/bot_state.json
          git add market_brain_data/paper_trades.json
          git add dashboard.json

          if ! git diff --cached --quiet; then
            git commit -m "Update market scanner data"
            git push origin HEAD:main
          else
            echo "No data changes to save"
          fi
