name: MARKET BRAIN AI

on:
  workflow_dispatch:

  schedule:
    # ہر 6 گھنٹے بعد backup restart
    - cron: "0 */6 * * *"

concurrency:
  group: market-brain-ai
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # PYTHON
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # PACKAGES
      # =========================================================
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      # =========================================================
      # MARKET BRAIN
      # =========================================================
      - name: Run Market Brain
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}

          BINANCE_BASE_URL: https://data-api.binance.vision

          SCAN_SECONDS: 60
          MIN_SCORE: 58
          DIRECTION_GAP: 5

          MAX_OPEN_TRADES: 8
          MAX_NEW_TRADES_PER_SCAN: 3

        run: |
          set -e

          while true
          do
            echo "=================================================="
            echo "MARKET BRAIN AI STARTING / RESTARTING"
            echo "=================================================="

            python main.py

            EXIT_CODE=$?

            echo "Market Brain stopped with exit code: $EXIT_CODE"
            echo "Restarting in 10 seconds..."

            sleep 10
          done

      # =========================================================
      # SAVE MEMORY
      # =========================================================
      - name: Save trade memory
        if: always()
        run: |
          git config user.name "market-brain-bot"
          git config user.email "market-brain-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Market Brain trade memory"
            git pull --rebase origin main || true
            git push
          fi
