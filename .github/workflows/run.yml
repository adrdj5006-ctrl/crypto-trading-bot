name: MARKET BRAIN AI

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: market-brain-ai
  cancel-in-progress: false

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market scanner
        env:
          BINANCE_BASE: https://data-api.binance.vision
          SCAN_SECONDS: "60"
          DATA_DIR: market_brain_data
        run: |
          python -u main.py

      - name: Save trade memory
        if: always()
        run: |
          git config user.name "market-brain-bot"
          git config user.email "market-brain-bot@users.noreply.github.com"

          git add market_brain_data

          if ! git diff --cached --quiet; then
            git commit -m "Save Market Brain trade memory"
            git push origin HEAD:main
          else
            echo "No trade memory changes."
          fi
